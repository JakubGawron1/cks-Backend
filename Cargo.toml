[package]
name = "slavia-backend"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true
opt-level = 3

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
jsonwebtoken = "9"
password-hash = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
# Lokalnie: plik SQLite/libSQL. Produkcja: Turso (remote HTTP + tls).
libsql = { version = "0.9", default-features = false, features = ["core", "remote", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
